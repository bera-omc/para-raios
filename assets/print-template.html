<!DOCTYPE html>
<!--
  Esqueleto de PDF para o plano de risco (para-raios).
  Fluxo: preencher o <body> com o conteúdo do plano, salvar como .html, e renderizar:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --no-pdf-header-footer \
      --print-to-pdf="plano.pdf" "file://$(pwd)/plano.html"

  (Em mac sem Chrome, qualquer Chromium serve. --no-pdf-header-footer tira o cabeçalho de URL/data.)
  Regra de cor (função, não decoração): .sim=verde · .nao=vermelho · .inc=âmbar.
  Importante: na coluna de veredito NÃO use white-space:nowrap — "Não tenho certeza" precisa quebrar
  linha ou transborda para a coluna seguinte.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Plano de risco & segurança de IA</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font: 11pt/1.5 Georgia, "Times New Roman", serif; color: #1b1b1b; margin: 0; }
  h1, h2, h3, .meta, th, .verdict { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 19pt; margin: 0 0 2px; color: #1f4e5f; letter-spacing: -.2px; }   /* troque a cor de acento por projeto */
  .sub { font-size: 10.5pt; color: #555; margin: 0 0 14px; }
  .meta { font-size: 9.5pt; color: #333; line-height: 1.45; border-left: 3px solid #1f4e5f; padding: 6px 0 6px 12px; margin: 0 0 16px; }
  h2 { font-size: 13pt; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd; color: #222; }
  p { margin: 0 0 9px; }
  table { width: 100%; border-collapse: collapse; font-size: 9.3pt; line-height: 1.4; table-layout: fixed; }
  col.cat { width: 11%; } col.q { width: 26%; } col.v { width: 14%; } col.obs { width: 49%; }
  th { background: #1f4e5f; color: #fff; text-align: left; padding: 7px 8px; font-size: 9pt; font-weight: 600; }
  td { border: 1px solid #d8d8d8; padding: 7px 8px; vertical-align: top; }
  tr { break-inside: avoid; }
  td.cat { font-weight: 700; font-size: 9.5pt; background: #eef3f4; color: #1f4e5f; vertical-align: middle; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .verdict { font-weight: 700; font-size: 9.3pt; overflow-wrap: break-word; }   /* NÃO usar white-space:nowrap */
  .sim { color: #1b7a3d; } .nao { color: #b00020; } .inc { color: #9a6700; }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 8.6pt; background: #f0f0f0; padding: 0 3px; border-radius: 3px; }
  ul, ol { margin: 4px 0 10px; padding-left: 20px; } li { margin: 0 0 5px; }
  .next { background: #eef3f4; border-left: 3px solid #1f4e5f; padding: 8px 12px; margin: 10px 0 0; }
  .pagebreak { page-break-before: always; }
  a { color: #1f4e5f; text-decoration: none; }
</style>
</head>
<body>
  <!-- CONTEÚDO DO PLANO AQUI (ver assets/template-plano.md para a estrutura) -->
</body>
</html>
